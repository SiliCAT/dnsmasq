name: Build and publish dnsmasq

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: dnsmasq-publish
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6

      - name: 构建最新镜像
        run: |
          docker build --pull --no-cache \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t dnsmasq-build:test .

      - name: 验证配置和 DNS 应答
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dnsutils

          printf '%s\n' \
            'no-resolv' \
            'host-record=ci.test,192.0.2.1' \
            > "${RUNNER_TEMP}/dnsmasq-test.conf"

          docker run --rm \
            -v "${RUNNER_TEMP}/dnsmasq-test.conf:/etc/dnsmasq.conf:ro" \
            dnsmasq-build:test --test

          docker run -d --name dnsmasq-ci \
            -v "${RUNNER_TEMP}/dnsmasq-test.conf:/etc/dnsmasq.conf:ro" \
            -p 127.0.0.1:1053:53/udp \
            -p 127.0.0.1:1053:53/tcp \
            dnsmasq-build:test

          udp_answer=''
          for attempt in {1..15}; do
            udp_answer="$(dig @127.0.0.1 -p 1053 ci.test A +short +notcp +ignore +time=1 +tries=1 || true)"
            if [ "$udp_answer" = '192.0.2.1' ]; then
              break
            fi
            sleep 1
          done
          test "$udp_answer" = '192.0.2.1'
          tcp_answer="$(dig @127.0.0.1 -p 1053 ci.test A +short +tcp +time=2 +tries=1)"
          test "$tcp_answer" = '192.0.2.1'
          echo '配置检查、UDP 查询、TCP 查询均已通过'

      - name: 登录 GHCR 并发布已测试的镜像
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag dnsmasq-build:test "${image}:${build_tag}"
          docker tag dnsmasq-build:test "${image}:latest"
          docker push "${image}:${build_tag}"
          docker push "${image}:latest"
          printf '已发布：%s:latest\n备份标签：%s:%s\n' "$image" "$image" "$build_tag"

      - name: 输出测试日志并清理容器
        if: always()
        run: |
          docker logs --tail 120 dnsmasq-ci || true
          docker rm -f dnsmasq-ci || true

